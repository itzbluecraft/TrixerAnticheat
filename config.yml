# ==========================================
#   Trixer Anticheat (AE)
# ==========================================

# Teleport the player back to their last safe location when flagged
setback: true

# Also print alerts to the console
alerts-to-console: true

# VL decay: every <interval> seconds each VL drops by <amount>
# (the interval needs a server restart to apply)
vl-decay-interval: 30
vl-decay-amount: 1.0

# Auto kick: shown when a player's VL reaches max-vl of a check
# (max-vl is set per check below). %check% = Flight / BoatFlight
kick-message: "&b[Trixer] Unfair Advantage"

checks:
  flight:
    enabled: true
    max-vl: 15
    # Violations in a row before a flag (higher = fewer false positives)
    buffer: 4
    # Allowed difference from vanilla gravity, per tick
    tolerance: 0.03
    # Ticks standing still in mid-air before Flight (B) flags
    stationary-ticks: 40
  boatflight:
    enabled: true
    max-vl: 10
    buffer: 6

messages:
  alert: "&b[Trixer] &f%player% &7failed &c%check% (%type%) &7VL: &f%vl% &8| %info% &8| %ping%ms"
  reloaded: "&aTrixer Anticheat config reloaded."
  alerts-on: "&aAlerts enabled."
  alerts-off: "&cAlerts disabled."
  no-permission: "&cYou don't have permission."
  player-not-found: "&cPlayer not found."
